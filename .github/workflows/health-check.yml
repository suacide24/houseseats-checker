name: Health Check

on:
  schedule:
    # Every 3 hours, at an off-peak minute (GitHub drops fewer of those).
    - cron: '17 */3 * * *'
  workflow_dispatch:  # Allow manual trigger

# Serialize with the show checker so their pushes don't race.
concurrency:
  group: houseseats-git
  cancel-in-progress: false

jobs:
  health:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Run health check
        env:
          SMTP_EMAIL: ${{ secrets.SMTP_EMAIL }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          NOTIFICATION_EMAIL: ${{ secrets.NOTIFICATION_EMAIL }}
          # Failure alerts are separate from show-notification email. Tune via
          # Settings > Secrets and variables > Actions > Variables (all optional):
          #   HEALTH_ALERTS_ENABLED=false -> mute failure alerts
          #   HEALTH_STALE_HOURS=24       -> hours with no successful scrape before alerting
          #   HEALTH_MAX_FAILURES=3       -> failed scrapes in a row before alerting
          HEALTH_ALERTS_ENABLED: ${{ vars.HEALTH_ALERTS_ENABLED }}
          HEALTH_STALE_HOURS: ${{ vars.HEALTH_STALE_HOURS }}
          HEALTH_MAX_FAILURES: ${{ vars.HEALTH_MAX_FAILURES }}
        run: python check_health.py

      - name: Commit health state if changed
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add health_state.json
          if git diff --staged --quiet; then
            exit 0
          fi
          git commit -q -m "Update health state - $(date -u +'%Y-%m-%d %H:%M UTC')"
          for attempt in 1 2 3 4 5; do
            if git push; then
              exit 0
            fi
            echo "Push failed (attempt $attempt of 5) - syncing and retrying"
            sleep $((attempt * 5))
            git pull --rebase origin "$GITHUB_REF_NAME" || git rebase --abort || true
          done
          echo "::error::Could not push health state after 5 attempts"
          exit 1
