name: Hide show

# Runs when someone submits the pre-filled issue behind a "Hide this show"
# link. Adds the show to that person's hidden list and closes the issue.
on:
  issues:
    types: [opened]

# Same group as the checker so pushes never race.
concurrency:
  group: houseseats-git
  cancel-in-progress: false

jobs:
  hide:
    if: ${{ startsWith(github.event.issue.title, 'Hide for ') }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
      issues: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
      - run: pip install -r requirements.txt

      - name: Update hidden list
        id: hide
        env:
          # Untrusted text: passed as env vars, never written into the script.
          ISSUE_TITLE: ${{ github.event.issue.title }}
          ISSUE_AUTHOR: ${{ github.event.issue.user.login }}
          REPO_OWNER: ${{ github.repository_owner }}
          SUBSCRIBERS: ${{ secrets.SUBSCRIBERS }}
        run: python tools/handle_hide_issue.py

      - name: Commit hidden list
        if: ${{ steps.hide.outputs.changed == 'true' }}
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add denylists
          git commit -q -m "Hide a show (issue #${{ github.event.issue.number }})"
          for attempt in 1 2 3 4 5; do
            if git push; then
              exit 0
            fi
            echo "Push failed (attempt $attempt of 5) - syncing and retrying"
            sleep $((attempt * 5))
            git pull --rebase origin "$GITHUB_REF_NAME" || git rebase --abort || true
          done
          echo "::error::Could not push the hidden list after 5 attempts"
          exit 1

      - name: Reply and close
        if: ${{ always() }}
        env:
          GH_TOKEN: ${{ github.token }}
          REPLY: ${{ steps.hide.outputs.reply }}
          ISSUE: ${{ github.event.issue.number }}
          JOB_STATUS: ${{ job.status }}
        run: |
          if [ "$JOB_STATUS" != "success" ] || [ -z "$REPLY" ]; then
            REPLY="Something went wrong and the show was not hidden. Please try again later."
          fi
          gh issue close "$ISSUE" --repo "$GITHUB_REPOSITORY" --comment "$REPLY"
